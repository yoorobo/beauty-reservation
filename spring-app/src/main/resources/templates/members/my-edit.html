<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>내 정보 수정</title>
</head>
<body>
<!-- D3(SR-03): 내 정보 수정 (비밀번호 비우면 기존 유지 [B3]) -->
<main class="container py-5" style="max-width: 480px;">
    <h1 class="h3 mb-4">내 정보 수정</h1>

    <form method="post" th:action="@{/members/my/edit}" th:object="${memberUpdateForm}">
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">오류 메시지</li>
            </ul>
        </div>

        <div class="mb-3">
            <label class="form-label">이름</label>
            <input type="text" class="form-control" th:field="*{name}">
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 오류</div>
        </div>
        <div class="mb-3">
            <label class="form-label">이메일</label>
            <input type="email" class="form-control" th:field="*{email}">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">이메일 오류</div>
        </div>
        <div class="mb-3">
            <label class="form-label">비밀번호
                <span class="text-secondary small">(변경 시에만 입력, 비우면 기존 유지)</span></label>
            <input type="password" class="form-control" placeholder="8~20자" th:field="*{password}">
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</div>
        </div>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary flex-fill" th:href="@{/members/my}">취소</a>
            <button type="submit" class="btn btn-primary flex-fill">수정</button>
        </div>
    </form>
</main>
<script></script>
</body>
</html>
