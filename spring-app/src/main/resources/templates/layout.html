<!DOCTYPE html>
<html lang="ko" th:fragment="layout(title, content, script)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WO-0723-05: Pretendard 웹폰트(dynamic-subset) + Bootstrap Icons — Bootstrap CSS 위 선언 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap CDN: static/ 번들 부재로 CDN 유지 (D3 제약) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- WO-0723-05: Bootstrap CSS 아래에 둬야 우선 적용 — Pretendard 공식 권장 폴백 체인 -->
    <style>
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont,
               system-ui, Roboto, "Helvetica Neue", "Segoe UI",
               "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    </style>
    <title th:replace="${title}">Title</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{navbar :: navbarFragment}"></nav>
<div class="flex-grow-1">
    <main th:replace="${content}"></main>
</div>
<footer th:replace="~{footer :: footerFragment}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="${script}"></th:block>
</body>
</html>
