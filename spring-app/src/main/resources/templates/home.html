<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CDN: CSS + JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>뷰티샵 예약</title>
</head>
<body>

<!-- 히어로 영역: 제목 + 소개 + 예약 버튼 -->
<section class="bg-light py-5">
    <div class="container">
        <h1 class="fw-bold">뷰티샵 예약 및 고객 관리</h1>
        <p class="text-secondary">시술 선택부터 예약, 관리자 승인, 고객 분석 자동화까지 한 번에 실습합니다.</p>
        <a href="/reservations/new" class="btn btn-primary">예약하기</a>
    </div>
</section>

<!-- 시술 메뉴 -->
<section class="container py-4">
    <h2 class="h4 mb-3">시술 메뉴</h2>
    <div class="card" style="max-width: 20rem;">
        <div class="card-body">
            <h5 class="card-title">서비스명</h5>
            <p class="card-text text-secondary">설명</p>
            <p class="fw-bold mb-0">0원</p>
        </div>
    </div>
</section>

<!-- 디자이너 -->
<section class="container py-4">
    <h2 class="h4 mb-3">디자이너</h2>
    <div class="card" style="max-width: 25rem;">
        <div class="card-body">
            <h5 class="card-title">이름</h5>
            <p class="card-text text-secondary mb-1">전문 분야</p>
            <p class="card-text text-secondary mb-0">소개</p>
        </div>
    </div>
</section>

<!-- 푸터 -->
<footer class="border-top py-3 mt-4">
    <p class="text-center text-secondary small mb-0">
        ALL RIGHT RESERVED BY <span class="text-primary fw-bold">Beauty Service</span>
    </p>
</footer>

</body>
</html>
