<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN: CSS + JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>뷰티샵 예약</title>
</head>
<body>

<!-- 히어로 영역 -->
<section class="bg-light py-5">
    <div class="container">
        <h1 class="fw-bold mb-3">뷰티샵 예약 및 고객 관리</h1>
        <p class="text-secondary mb-4">
            시술 선택부터 예약, 관리자 승인, 고객 분석 자동화까지 한 번에 실습합니다.
        </p>
        <a th:href="@{/reservations/new}" class="btn btn-primary">예약하기</a>
    </div>
</section>

<!-- 시술 메뉴 -->
<section class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">시술 메뉴</h2>
        <a th:href="@{/reservations/new}" class="btn btn-outline-primary btn-sm">예약하기</a>
    </div>

    <div class="row g-3" th:if="${services != null and !services.isEmpty()}">
        <div class="col-12 col-md-6 col-lg-4" th:each="service : ${services}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${service.serviceName}">서비스명</h5>
                    <p class="card-text text-secondary" th:text="${service.description}">
                        설명
                    </p>
                    <p class="fw-bold mb-0" th:text="${service.price} + '원'">
                        0원
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-light border" th:if="${services == null or services.isEmpty()}">
        등록된 시술이 없습니다.
    </div>
</section>

<!-- 디자이너 -->
<section class="container py-5">
    <h2 class="h4 mb-3">디자이너</h2>

    <div class="row g-3" th:if="${designers != null and !designers.isEmpty()}">
        <div class="col-12 col-md-6 col-lg-4" th:each="designer : ${designers}">
            <div class="card h-100">
                <div class="card-body">
                    <h3 class="h5 card-title" th:text="${designer.name}">이름</h3>
                    <p class="text-primary fw-semibold mb-2" th:text="${designer.specialty}">
                        전문 분야
                    </p>
                    <p class="card-text text-secondary" th:text="${designer.introduction}">
                        소개
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-light border" th:if="${designers == null or designers.isEmpty()}">
        등록된 디자이너가 없습니다.
    </div>
</section>

<!-- 푸터 -->
<footer class="border-top py-3 mt-4">
    <p class="text-center text-secondary small mb-0">
        ALL RIGHT RESERVED BY <span class="text-primary fw-bold">Beauty Service</span>
    </p>
</footer>

</body>
</html>
