<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>시술 관리</title>
</head>
<body>
<!-- W-16 GET/POST /admin/services : 시술 관리(등록·수정·삭제) [SR-11] -->
<main class="container py-5">
    <h1 class="h3 mb-4">시술 관리</h1>

    <!-- 등록/수정 폼 (beautyServiceForm.id 존재 시 수정 모드) [S1·B1·B2·B4] — POST /admin/services 통합, hidden id로 분기 -->
    <form method="post"
          th:action="@{/admin/services}"
          th:object="${beautyServiceForm}">
        <input type="hidden" th:field="*{id}">

        <!-- 상단 빨간 알림 박스: 오류 메시지 목록 [S3] -->
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">오류 메시지</li>
            </ul>
        </div>

        <!-- 입력칸 4개 + 등록/수정 버튼 : 가로 1행, 라벨 없이 placeholder [B1·B2] -->
        <div class="row g-2 align-items-start">
            <div class="col-12 col-md">
                <input type="text" class="form-control" placeholder="시술명" th:field="*{serviceName}">
                <div class="text-danger small" th:if="${#fields.hasErrors('serviceName')}"
                     th:errors="*{serviceName}">시술명 오류</div>
            </div>
            <div class="col-12 col-md">
                <input type="number" class="form-control" placeholder="가격(원)" th:field="*{price}">
                <div class="text-danger small" th:if="${#fields.hasErrors('price')}"
                     th:errors="*{price}">가격 오류</div>
            </div>
            <div class="col-12 col-md">
                <input type="number" class="form-control" placeholder="소요시간(분)" th:field="*{duration}">
                <div class="text-danger small" th:if="${#fields.hasErrors('duration')}"
                     th:errors="*{duration}">소요시간 오류</div>
            </div>
            <div class="col-12 col-md">
                <input type="text" class="form-control" placeholder="설명" th:field="*{description}">
            </div>
            <div class="col-12 col-md-auto">
                <!-- 수정 모드: btn-warning(노랑) / 등록 모드: btn-primary(파랑) [B4] -->
                <!-- md 미만: 전체 폭(w-100) 세로 스택 / md 이상: col-md-auto 폭 = 버튼 크기라 외형 동일 -->
                <button type="submit" class="btn w-100"
                        th:classappend="${beautyServiceForm.id} != null ? 'btn-warning' : 'btn-primary'"
                        th:text="${beautyServiceForm.id} != null ? '수정' : '등록'">등록</button>
                <a th:if="${beautyServiceForm.id} != null" class="btn btn-outline-secondary"
                   href="/admin/services">취소</a>
            </div>
        </div>
    </form>

    <!-- 목록 (폼 아래) : 헤더행 없이 데이터 행만 [B3·S4] -->
    <hr class="my-4">
    <table class="table">
        <!-- WO-0723-10 A2: 헤더행 추가 — 어느 값이 무엇인지 식별 가능하게 -->
        <thead>
        <tr>
            <th>시술명</th><th>가격(원)</th><th>소요시간(분)</th><th>설명</th><th class="text-end">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="service : ${services}">
            <td th:text="${service.serviceName}">시술</td>
            <!-- WO-0723-10 A3: 천단위 콤마 + "원" -->
            <td th:text="${#numbers.formatInteger(service.price, 3, 'COMMA')} + '원'">20,000원</td>
            <!-- WO-0723-10 A3: 소요시간 "분" 표기 -->
            <td th:text="${service.duration} + '분'">40분</td>
            <td th:text="${service.description}">설명</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/admin/services/{id}/edit(id=${service.id})}">수정</a>
                <form class="d-inline" method="post"
                      th:action="@{/admin/services/{id}/delete(id=${service.id})}"
                      onsubmit="return confirm('삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(services)}">
            <td colspan="5" class="text-center text-secondary">등록된 시술이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</main>
<script></script>
</body>
</html>
