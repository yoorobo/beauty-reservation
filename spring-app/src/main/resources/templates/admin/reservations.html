<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>예약 관리</title>
</head>
<body>
<!-- D6(SR-11): 관리자 예약 관리 — 조회·검색(날짜·상태 AND)·상태변경(POST) -->
<main class="container py-4">
    <!-- 헤더: 좌측 제목 / 우측 관리자 공통 탭 4개 (현재 화면=예약 관리는 탭에 없어 전부 활성) -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
        <h1 class="h3 mb-0">예약 관리</h1>
        <div class="btn-group" role="group" aria-label="관리자 탭">
            <a class="btn btn-outline-secondary" th:href="@{/admin}">관리자 홈</a>
            <a class="btn btn-outline-secondary" th:href="@{/admin/members}">회원 관리</a>
            <a class="btn btn-outline-secondary" th:href="@{/admin/services}">시술 관리</a>
            <a class="btn btn-outline-secondary" th:href="@{/admin/designers}">디자이너 관리</a>
        </div>
    </div>

    <!-- 검색바 한 줄: 날짜 + 상태 + 검색 (기존 폼 표준 반응형 col-12 col-lg) -->
    <form method="get" th:action="@{/admin/reservations}" class="row g-2 align-items-end mb-2">
        <div class="col-12 col-lg">
            <input type="date" name="date" class="form-control" th:value="${date}">
        </div>
        <div class="col-12 col-lg">
            <select name="status" class="form-select">
                <option value="">전체 상태</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                        th:selected="${st == selectedStatus}">상태</option>
            </select>
        </div>
        <div class="col-12 col-lg-auto">
            <button type="submit" class="btn btn-primary w-100">검색</button>
        </div>
    </form>

    <!-- 검색 조건 적용 시 전체 보기 버튼 노출 -->
    <div th:if="${date != null or selectedStatus != null}" class="mb-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/reservations}">전체 예약 보기</a>
    </div>
    <div th:unless="${date != null or selectedStatus != null}" class="mb-3"></div>

    <!-- 예약 목록 -->
    <table class="table align-middle">
        <thead>
        <tr>
            <th>날짜</th><th>시간</th><th>고객</th><th>시술</th><th>디자이너</th>
            <th>현재 상태</th><th>상태 변경</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservations}">
            <td th:text="${#temporals.format(r.reservationDate, 'yyyy-MM-dd')}">2026-07-15</td>
            <td th:text="${#temporals.format(r.reservationTime, 'HH:mm')}">23:50</td>
            <td th:text="${r.member.name}">고객</td>
            <td th:text="${r.beautyService.serviceName}">시술</td>
            <td th:text="${r.designer.name}">디자이너</td>
            <!-- 현재 상태 배지 (한글 라벨 + 색상) -->
            <td th:switch="${r.status.name()}">
                <span th:case="'REQUESTED'" class="badge bg-warning text-dark" th:text="${r.status.label}">승인 대기</span>
                <span th:case="'CONFIRMED'" class="badge bg-primary" th:text="${r.status.label}">예약 승인</span>
                <span th:case="'COMPLETED'" class="badge bg-success" th:text="${r.status.label}">완료</span>
                <span th:case="'CANCELED'" class="badge bg-secondary" th:text="${r.status.label}">취소</span>
                <span th:case="'NO_SHOW'" class="badge bg-danger" th:text="${r.status.label}">노쇼</span>
            </td>
            <!-- 상태 변경 액션 (상태별 분기, 각각 POST form) -->
            <td th:switch="${r.status.name()}">
                <!-- REQUESTED: 승인 / 취소 -->
                <div th:case="'REQUESTED'" class="d-flex gap-1">
                    <form method="post" class="d-inline"
                          th:action="@{/admin/reservations/{id}/status(id=${r.id})}">
                        <input type="hidden" name="status" value="CONFIRMED">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="filterStatus" th:value="${selectedStatus}">
                        <button type="submit" class="btn btn-sm btn-primary">승인</button>
                    </form>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/reservations/{id}/status(id=${r.id})}">
                        <input type="hidden" name="status" value="CANCELED">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="filterStatus" th:value="${selectedStatus}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">취소</button>
                    </form>
                </div>
                <!-- CONFIRMED: 완료 / 취소 / 노쇼 -->
                <div th:case="'CONFIRMED'" class="d-flex gap-1">
                    <form method="post" class="d-inline"
                          th:action="@{/admin/reservations/{id}/status(id=${r.id})}">
                        <input type="hidden" name="status" value="COMPLETED">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="filterStatus" th:value="${selectedStatus}">
                        <button type="submit" class="btn btn-sm btn-success">완료</button>
                    </form>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/reservations/{id}/status(id=${r.id})}">
                        <input type="hidden" name="status" value="CANCELED">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="filterStatus" th:value="${selectedStatus}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">취소</button>
                    </form>
                    <form method="post" class="d-inline"
                          th:action="@{/admin/reservations/{id}/status(id=${r.id})}">
                        <input type="hidden" name="status" value="NO_SHOW">
                        <input type="hidden" name="date" th:value="${date}">
                        <input type="hidden" name="filterStatus" th:value="${selectedStatus}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">노쇼</button>
                    </form>
                </div>
                <!-- COMPLETED / CANCELED / NO_SHOW: 액션 없음 -->
                <span th:case="*" class="text-secondary">처리 완료</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservations)}">
            <td colspan="7" class="text-center text-secondary">예약 내역이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</main>
<script></script>
</body>
</html>
