<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>디자이너 관리</title>
</head>
<body>
<!-- W-17 GET/POST /admin/designers : 디자이너 관리(등록·수정·삭제) [SR-11] -->
<main class="container py-4">
    <h1 class="h3 mb-4">디자이너 관리</h1>

    <!-- 등록/수정 폼 (editId 존재 시 수정 모드) [B5] -->
    <form method="post"
          th:action="${editId} != null ? @{/admin/designers/{id}/update(id=${editId})} : @{/admin/designers}"
          th:object="${designerForm}">

        <!-- 상단 빨간 알림 박스: 오류 메시지 목록 -->
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">오류 메시지</li>
            </ul>
        </div>

        <!-- 입력칸 3개 + 등록/수정 버튼 : 가로 1행, 라벨 없이 placeholder [B5] -->
        <div class="row g-2 align-items-start">
            <div class="col-12 col-lg">
                <input type="text" class="form-control" placeholder="이름" th:field="*{name}">
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">이름 오류</div>
            </div>
            <div class="col-12 col-lg">
                <input type="text" class="form-control" placeholder="전문분야" th:field="*{specialty}">
            </div>
            <div class="col-12 col-lg">
                <input type="text" class="form-control" placeholder="소개" th:field="*{introduction}">
            </div>
            <div class="col-12 col-lg-auto">
                <!-- 수정 모드: btn-warning(노랑) / 등록 모드: btn-primary(파랑) [B5] -->
                <!-- lg 미만: 전체 폭(w-100) 세로 스택 / lg 이상: col-lg-auto 폭 = 버튼 크기라 외형 동일 -->
                <button type="submit" class="btn w-100"
                        th:classappend="${editId} != null ? 'btn-warning' : 'btn-primary'"
                        th:text="${editId} != null ? '수정' : '등록'">등록</button>
                <a th:if="${editId} != null" class="btn btn-outline-secondary"
                   href="/admin/designers">취소</a>
            </div>
        </div>
    </form>

    <!-- 목록 (폼 아래) : 헤더행 없이 데이터 행만 [B5] -->
    <hr class="my-4">
    <table class="table table-hover align-middle">
        <tbody>
        <tr th:each="designer : ${designers}">
            <td th:text="${designer.name}">이름</td>
            <td th:text="${designer.specialty}">전문분야</td>
            <td th:text="${designer.introduction}">소개</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/admin/designers/{id}/edit(id=${designer.id})}">수정</a>
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/admin/designers/{id}/delete(id=${designer.id})}">삭제</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(designers)}">
            <td colspan="4" class="text-center text-secondary">등록된 디자이너가 없습니다.</td>
        </tr>
        </tbody>
    </table>
</main>
<script></script>
</body>
</html>
