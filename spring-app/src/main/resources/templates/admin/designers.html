<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>디자이너 관리</title>
</head>
<body>
<!-- W-17 GET/POST /admin/designers : 디자이너 관리(등록·수정·삭제) [SR-11] -->
<main class="container py-4">
    <h1 class="h3 mb-4">디자이너 관리</h1>

    <!-- 등록/수정 폼 (designerForm.id 존재 시 수정 모드) [B5] — POST /admin/designers 통합, hidden id로 분기 -->
    <form method="post"
          th:action="@{/admin/designers}"
          th:object="${designerForm}">
        <input type="hidden" th:field="*{id}">

        <!-- 상단 빨간 알림 박스: 오류 메시지 목록 -->
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">오류 메시지</li>
            </ul>
        </div>

        <!-- 입력칸 3개 + 등록/수정 버튼 : 가로 1행, 라벨 없이 placeholder [B5] -->
        <div class="row g-2 align-items-start">
            <div class="col-12 col-md">
                <input type="text" class="form-control" placeholder="이름" th:field="*{name}">
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">이름 오류</div>
            </div>
            <div class="col-12 col-md">
                <!-- 전문 분야: 직접 입력 → 드롭다운 선택 (빈 값이면 @NotBlank 검증 작동) -->
                <select class="form-select" th:field="*{specialty}">
                    <option value="">전문 분야 선택</option>
                    <option value="헤어">헤어</option>
                    <option value="피부관리">피부관리</option>
                    <option value="네일">네일</option>
                    <option value="메이크업">메이크업</option>
                    <option value="왁싱">왁싱</option>
                    <option value="속눈썹">속눈썹</option>
                    <option value="두피케어">두피케어</option>
                    <option value="웨딩케어">웨딩케어</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('specialty')}"
                     th:errors="*{specialty}">전문분야 오류</div>
            </div>
            <div class="col-12 col-md">
                <input type="text" class="form-control" placeholder="소개" th:field="*{introduction}">
            </div>
            <div class="col-12 col-md-auto">
                <!-- 수정 모드: btn-warning(노랑) / 등록 모드: btn-primary(파랑) [B5] -->
                <!-- 현대 UI 관례: 취소(보조·왼쪽) → 수정/등록(기본·오른쪽), d-flex로 항상 같은 줄 -->
                <div class="d-flex gap-2">
                    <a th:if="${designerForm.id} != null" class="btn btn-outline-secondary flex-fill"
                       href="/admin/designers">취소</a>
                    <button type="submit" class="btn flex-fill"
                            th:classappend="${designerForm.id} != null ? 'btn-warning' : 'btn-primary'"
                            th:text="${designerForm.id} != null ? '수정' : '등록'">등록</button>
                </div>
            </div>
        </div>
    </form>

    <!-- 목록 (폼 아래) : 헤더행 없이 데이터 행만 [B5] -->
    <hr class="my-4">
    <table class="table table-hover align-middle">
        <tbody>
        <tr th:each="designer : ${designers}">
            <td th:text="${designer.name}">이름</td>
            <td th:text="${designer.specialty}">전문분야</td>
            <td th:text="${designer.introduction}">소개</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/admin/designers/{id}/edit(id=${designer.id})}">수정</a>
                <form class="d-inline" method="post"
                      th:action="@{/admin/designers/{id}/delete(id=${designer.id})}"
                      onsubmit="return confirm('삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(designers)}">
            <td colspan="4" class="text-center text-secondary">등록된 디자이너가 없습니다.</td>
        </tr>
        </tbody>
    </table>
</main>
<script></script>
</body>
</html>
