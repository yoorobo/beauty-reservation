<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>예약하기</title>
</head>
<body>
<!-- D5(SR-07): 예약 등록/수정 폼 (reservationForm.id 존재 시 수정 모드) -->
<main class="container py-5">
    <h1 class="h3 mb-4" th:text="${reservationForm.id} != null ? '예약 수정' : '예약하기'">예약하기</h1>

    <!-- 신규: POST /reservations / 수정: POST /reservations/{id}/edit -->
    <form method="post"
          th:object="${reservationForm}"
          th:action="${reservationForm.id} != null ? @{/reservations/{id}/edit(id=${reservationForm.id})} : @{/reservations}">
        <!-- 수정 모드 유지용: 검증 오류로 폼 재표시돼도 id 보존 (기존 폼 표준 패턴) -->
        <input type="hidden" th:field="*{id}">

        <!-- 상단 빨간 알림 박스: 오류 메시지 목록 (기존 폼 표준 패턴) -->
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">오류 메시지</li>
            </ul>
        </div>

        <div class="row g-3">
            <!-- 시술 선택 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="serviceId">시술</label>
                <select class="form-select" id="serviceId" th:field="*{serviceId}">
                    <option value="">시술을 선택하세요</option>
                    <!-- R5: 시술명 · 가격(천단위 콤마)원 · 소요시간분 -->
                    <option th:each="s : ${services}" th:value="${s.id}"
                            th:text="${s.serviceName} + ' · ' + ${#numbers.formatInteger(s.price, 3, 'COMMA')} + '원 · ' + ${s.duration} + '분'">시술 · 25,000원 · 40분</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('serviceId')}"
                     th:errors="*{serviceId}">시술 오류</div>
            </div>

            <!-- 디자이너 선택 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="designerId">디자이너</label>
                <select class="form-select" id="designerId" th:field="*{designerId}">
                    <option value="">디자이너를 선택하세요</option>
                    <!-- R6: 전문 분야 함께 표시. specialty 비어있으면 이름만(빈 구분자 노출 금지) -->
                    <option th:each="d : ${designers}" th:value="${d.id}"
                            th:text="${!#strings.isEmpty(d.specialty)} ? (${d.name} + ' · ' + ${d.specialty}) : ${d.name}">디자이너 · 커트/펌</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('designerId')}"
                     th:errors="*{designerId}">디자이너 오류</div>
            </div>

            <!-- 예약 날짜 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="reservationDate">예약 날짜</label>
                <!-- R4: 과거 선택 차단(min=오늘). 서버 @FutureOrPresent는 유지(클라 제약은 보안 아님) -->
                <input type="date" class="form-control" id="reservationDate" th:field="*{reservationDate}" th:min="${today}">
                <div class="text-danger small" th:if="${#fields.hasErrors('reservationDate')}"
                     th:errors="*{reservationDate}">날짜 오류</div>
            </div>

            <!-- 예약 시간 (WO-03 A1: select → 오전/오후 버튼 그리드. 슬롯은 WO-02 컨트롤러 SSOT timeSlots 재사용, 재구현 아님) -->
            <div class="col-12"
                 th:with="selectedTime=${reservationForm.reservationTime != null ? #temporals.format(reservationForm.reservationTime, 'HH:mm') : ''}">
                <label class="form-label">예약 시간</label>
                <!-- 선택 값은 hidden으로 전송 (JS가 버튼 클릭 시 갱신). 검증오류·수정모드에도 값 보존 -->
                <input type="hidden" th:field="*{reservationTime}">

                <!-- 오전 (12:00 이전) -->
                <div class="mb-2">
                    <div class="text-secondary small mb-1">오전</div>
                    <div class="row g-2">
                        <!-- 반응형: 모바일 3열(col-4) / 태블릿 4열(col-md-3) / 데스크톱 6열(col-lg-2) -->
                        <div class="col-4 col-md-3 col-lg-2"
                             th:each="slot : ${timeSlots}" th:if="${slot lt '12:00'}">
                            <button type="button" class="btn w-100 slot-btn"
                                    th:classappend="${slot == selectedTime} ? 'btn-primary' : 'btn-outline-secondary'"
                                    th:attr="data-slot=${slot},aria-pressed=${slot == selectedTime}"
                                    th:text="${slot}">10:00</button>
                        </div>
                        <!-- A3: 레거시(비슬롯) 기존 시각 — 오전에 해당하면 여기 -->
                        <div class="col-4 col-md-3 col-lg-2"
                             th:if="${legacySlot != null and legacySlot lt '12:00'}">
                            <button type="button" class="btn w-100 slot-btn"
                                    th:classappend="${legacySlot == selectedTime} ? 'btn-primary' : 'btn-outline-secondary'"
                                    th:attr="data-slot=${legacySlot},aria-pressed=${legacySlot == selectedTime}"
                                    th:text="${legacySlot} + ' 기존'">10:49 기존</button>
                        </div>
                    </div>
                </div>

                <!-- 오후 (12:00 이후) -->
                <div>
                    <div class="text-secondary small mb-1">오후</div>
                    <div class="row g-2">
                        <div class="col-4 col-md-3 col-lg-2"
                             th:each="slot : ${timeSlots}" th:if="${slot ge '12:00'}">
                            <button type="button" class="btn w-100 slot-btn"
                                    th:classappend="${slot == selectedTime} ? 'btn-primary' : 'btn-outline-secondary'"
                                    th:attr="data-slot=${slot},aria-pressed=${slot == selectedTime}"
                                    th:text="${slot}">14:00</button>
                        </div>
                        <!-- A3: 레거시(비슬롯) 기존 시각 — 오후에 해당하면 여기 -->
                        <div class="col-4 col-md-3 col-lg-2"
                             th:if="${legacySlot != null and legacySlot ge '12:00'}">
                            <button type="button" class="btn w-100 slot-btn"
                                    th:classappend="${legacySlot == selectedTime} ? 'btn-primary' : 'btn-outline-secondary'"
                                    th:attr="data-slot=${legacySlot},aria-pressed=${legacySlot == selectedTime}"
                                    th:text="${legacySlot} + ' 기존'">13:30 기존</button>
                        </div>
                    </div>
                </div>

                <div class="text-danger small" th:if="${#fields.hasErrors('reservationTime')}"
                     th:errors="*{reservationTime}">시간 오류</div>
            </div>

            <!-- 요청 메모 -->
            <div class="col-12">
                <label class="form-label" for="requestMemo">요청 메모</label>
                <textarea class="form-control" id="requestMemo" rows="3"
                          placeholder="요청 사항이 있으면 입력하세요 (선택)" th:field="*{requestMemo}"></textarea>
            </div>

            <!-- 버튼: 신규=전체폭 CTA + 이탈 링크 / 수정=반반 2개 (강사 화면 정렬) -->
            <div class="col-12">
                <!-- 수정 모드: [수정 취소] [수정 완료] 각 50%
                     "취소"는 예약 취소로 오해될 수 있어 "수정 취소"로 명시 -->
                <div class="row g-2" th:if="${reservationForm.id} != null">
                    <div class="col-6">
                        <a class="btn btn-outline-secondary w-100"
                           th:href="@{/reservations/my}">수정 취소</a>
                    </div>
                    <div class="col-6">
                        <button type="submit" class="btn btn-primary w-100">수정 완료</button>
                    </div>
                </div>

                <!-- 신규 모드: [예약 요청] 전체폭 CTA + 이탈 경로(tertiary 링크)
                     보조 액션은 시각 무게를 최소화해 primary CTA를 방해하지 않도록 배치 -->
                <div th:unless="${reservationForm.id} != null">
                    <button type="submit" class="btn btn-primary w-100">예약 요청</button>
                    <div class="text-center mt-3">
                        <a class="link-secondary small text-decoration-none"
                           th:href="@{/reservations/my}">내 예약으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>
<script>
    // WO-03 A1/A2: 슬롯 버튼 그리드 — 클릭 시 hidden(reservationTime) 갱신 + 선택 스타일/aria 토글.
    // 초기 선택 상태는 서버(th:classappend)가 렌더하므로 JS 미동작 시에도 수정/검증오류 선택은 보존됨.
    (function () {
        var hidden = document.getElementById('reservationTime');
        if (!hidden) { return; }
        var buttons = document.querySelectorAll('.slot-btn');
        buttons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                hidden.value = btn.getAttribute('data-slot');
                buttons.forEach(function (b) {
                    var on = (b === btn);
                    b.classList.toggle('btn-primary', on);
                    b.classList.toggle('btn-outline-secondary', !on);
                    b.setAttribute('aria-pressed', on ? 'true' : 'false');
                });
            });
        });
    })();
</script>
</body>
</html>
