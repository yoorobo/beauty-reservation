<!DOCTYPE html>
<html lang="ko" th:replace="~{layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>예약하기</title>
</head>
<body>
<!-- D5(SR-07): 예약 등록/수정 폼 (reservationForm.id 존재 시 수정 모드) -->
<main class="container py-5">
    <h1 class="h3 mb-4" th:text="${reservationForm.id} != null ? '예약 수정' : '예약하기'">예약하기</h1>

    <!-- 신규: POST /reservations / 수정: POST /reservations/{id}/edit -->
    <form method="post"
          th:object="${reservationForm}"
          th:action="${reservationForm.id} != null ? @{/reservations/{id}/edit(id=${reservationForm.id})} : @{/reservations}">
        <!-- 수정 모드 유지용: 검증 오류로 폼 재표시돼도 id 보존 (기존 폼 표준 패턴) -->
        <input type="hidden" th:field="*{id}">

        <!-- 상단 빨간 알림 박스: 오류 메시지 목록 (기존 폼 표준 패턴) -->
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">오류 메시지</li>
            </ul>
        </div>

        <div class="row g-3">
            <!-- 시술 선택 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="serviceId">시술</label>
                <select class="form-select" id="serviceId" th:field="*{serviceId}">
                    <option value="">시술을 선택하세요</option>
                    <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.serviceName}">시술</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('serviceId')}"
                     th:errors="*{serviceId}">시술 오류</div>
            </div>

            <!-- 디자이너 선택 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="designerId">디자이너</label>
                <select class="form-select" id="designerId" th:field="*{designerId}">
                    <option value="">디자이너를 선택하세요</option>
                    <option th:each="d : ${designers}" th:value="${d.id}" th:text="${d.name}">디자이너</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('designerId')}"
                     th:errors="*{designerId}">디자이너 오류</div>
            </div>

            <!-- 예약 날짜 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="reservationDate">예약 날짜</label>
                <input type="date" class="form-control" id="reservationDate" th:field="*{reservationDate}">
                <div class="text-danger small" th:if="${#fields.hasErrors('reservationDate')}"
                     th:errors="*{reservationDate}">날짜 오류</div>
            </div>

            <!-- 예약 시간 -->
            <div class="col-12 col-lg-6">
                <label class="form-label" for="reservationTime">예약 시간</label>
                <input type="time" class="form-control" id="reservationTime" th:field="*{reservationTime}">
                <div class="text-danger small" th:if="${#fields.hasErrors('reservationTime')}"
                     th:errors="*{reservationTime}">시간 오류</div>
            </div>

            <!-- 요청 메모 -->
            <div class="col-12">
                <label class="form-label" for="requestMemo">요청 메모</label>
                <textarea class="form-control" id="requestMemo" rows="3"
                          placeholder="요청 사항이 있으면 입력하세요 (선택)" th:field="*{requestMemo}"></textarea>
            </div>

            <!-- 버튼: 신규=전체폭 CTA + 이탈 링크 / 수정=반반 2개 (강사 화면 정렬) -->
            <div class="col-12">
                <!-- 수정 모드: [수정 취소] [수정 완료] 각 50%
                     "취소"는 예약 취소로 오해될 수 있어 "수정 취소"로 명시 -->
                <div class="row g-2" th:if="${reservationForm.id} != null">
                    <div class="col-6">
                        <a class="btn btn-outline-secondary w-100"
                           th:href="@{/reservations/my}">수정 취소</a>
                    </div>
                    <div class="col-6">
                        <button type="submit" class="btn btn-primary w-100">수정 완료</button>
                    </div>
                </div>

                <!-- 신규 모드: [예약 요청] 전체폭 CTA + 이탈 경로(tertiary 링크)
                     보조 액션은 시각 무게를 최소화해 primary CTA를 방해하지 않도록 배치 -->
                <div th:unless="${reservationForm.id} != null">
                    <button type="submit" class="btn btn-primary w-100">예약 요청</button>
                    <div class="text-center mt-3">
                        <a class="link-secondary small text-decoration-none"
                           th:href="@{/reservations/my}">내 예약으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>
<script></script>
</body>
</html>
