<!-- 공통 상단 내비게이션 -->
<!-- 강사 표준 정렬(0721): 메뉴 전체 우측 정렬 / navbar-expand-md -->
<!-- D3(SR-03): 로그인 상태별 표시 (sec:authorize) — 비로그인: 로그인·회원가입 / 로그인: 내 정보·로그아웃 / ADMIN: 관리자 -->
<nav th:fragment="navbarFragment"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     class="navbar navbar-expand-md navbar-light bg-light border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Beauty Service</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <!-- D5(SR-07): 예약하기·내 예약 연결 (인증 분기 구조 유지) -->
                <li class="nav-item"><a class="nav-link" th:href="@{/reservations/new}">예약하기</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/reservations/my}">내 예약</a>
                </li>

                <!-- ADMIN 전용 관리자 메뉴 -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin">관리자</a>
                </li>

                <!-- 비로그인: 로그인·회원가입 -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/members/join}">회원가입</a>
                </li>

                <!-- 로그인: 내 정보 + 로그아웃(POST) -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/members/my}">내 정보</a>
                </li>
                <li class="nav-item ms-lg-2" sec:authorize="isAuthenticated()">
                    <form method="post" th:action="@{/logout}" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
