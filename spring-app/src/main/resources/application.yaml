spring:
  application:
    name: spring-app
  datasource:
    url: jdbc:mysql://localhost:3306/beauty_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # D4(SR-03): 카카오 OAuth2 로그인 (oauth2Login 자동 방식)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:change-me}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# [WO-0727-09] 관리자 초기 비밀번호 — 소스 하드코딩 제거, 환경변수(ADMIN_INITIAL_PASSWORD) 주입
# 미설정 시 빈 문자열 → DataInitializer가 admin 시드를 건너뜀(경고 로그)
app:
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # [WO-0729-17] /api/** 인증용 API Key — 기본값을 두지 않는다.
  #   환경변수 API_KEY 미설정 시 플레이스홀더 해석 실패로, 빈 값이면 @NotBlank 위반으로 기동이 중단된다(fail-fast).
  api:
    key: ${API_KEY}

logging:
  level:
    org.hibernate.SQL: debug   #Hibernate가 실행하는 SQL 문을 출력
    org.hibernate.orm.jdbc.bind: trace   # 실제 어떤값이 바인딩 되는지 알려준다.